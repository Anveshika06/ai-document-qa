import { useEffect, useState } from 'react';

const API = import.meta.env.VITE_API_URL || 'http://localhost:8001';
const initial = { answer: '', needs_review: false, sources: [] };
const T = {
  page: { minHeight: '100vh', background: '#f6f4f0', color: '#272d33', fontFamily: 'Inter, system-ui, sans-serif', padding: '28px 18px 80px' },
  wrap: { maxWidth: 1080, margin: '0 auto' },
  header: { display: 'flex', justifyContent: 'space-between', flexWrap: 'wrap', gap: 14, alignItems: 'center', marginBottom: 22 },
  title: { fontSize: 'clamp(24px, 3vw, 34px)', letterSpacing: '-.035em', margin: '8px 0 4px', fontWeight: 730 },
  muted: { color: '#667078', fontSize: 13, lineHeight: 1.6 },
  eyebrow: { fontSize: 11, letterSpacing: '.14em', color: '#51776e', textTransform: 'uppercase', fontWeight: 800 },
  grid: { display: 'grid', gridTemplateColumns: 'minmax(270px, 365px) minmax(0, 1fr)', gap: 18, alignItems: 'start' },
  card: { borderRadius: 16, background: '#fff', padding: 22, boxShadow: '0 3px 18px #1f29370b', border: '1px solid #e6e9e6', marginBottom: 16 },
  label: { fontSize: 12, fontWeight: 700, margin: '14px 0 6px', display: 'block' },
  field: { width: '100%', padding: '11px 12px', fontSize: 14, border: '1px solid #d5ddd9', borderRadius: 9, color: '#273238', background: '#fff', boxSizing: 'border-box' },
  btn: { border: 'none', borderRadius: 9, padding: '11px 15px', background: '#547c70', color: '#fff', fontWeight: 700, cursor: 'pointer' },
  outline: { border: '1px solid #d5ddd9', borderRadius: 9, padding: '8px 10px', background: '#fff', color: '#33424b', cursor: 'pointer' },
  pill: { fontSize: 11, background: '#eaf4ee', borderRadius: 12, color: '#356554', padding: '4px 8px', fontWeight: 700 },
  divider: { borderTop: '1px solid #e9ecea', paddingTop: 13, marginTop: 16 },
};

export default function App() {
  const [docs, setDocs] = useState([]);
  const [title, setTitle] = useState('');
  const [kind, setKind] = useState('policy');
  const [text, setText] = useState('');
  const [file, setFile] = useState(null);
  const [selected, setSelected] = useState([]);
  const [question, setQuestion] = useState('');
  const [answer, setAnswer] = useState(null);
  const [busy, setBusy] = useState(false);
  const [message, setMessage] = useState('');

  async function request(path, options) {
    const res = await fetch(`${API}${path}`, options);
    const data = await res.json();
    if (!res.ok) throw new Error(typeof data.detail === 'string' ? data.detail : `Request failed (${res.status})`);
    return data;
  }
  async function loadDocs() {
    try {
      const data = await request('/documents');
      setDocs(data.documents);
      setSelected(prev => prev.filter(id => data.documents.some(d => d.id === id)));
    } catch (e) { setMessage(`Could not connect to backend: ${e.message}`); }
  }
  useEffect(() => { loadDocs(); }, []);

  async function upload(e) {
    e.preventDefault(); setBusy(true); setMessage('');
    try {
      let result;
      if (file) {
        const fd = new FormData(); fd.append('file', file); fd.append('kind', kind);
        result = await request('/documents/upload', { method: 'POST', body: fd });
      } else {
        result = await request('/documents/text', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ title, kind, text }) });
      }
      setMessage(result.duplicate ? 'This document is already indexed.' : `Indexed ${result.chunks} chunks. Ready for questions.`);
      setFile(null); setText(''); setTitle('');
      const picker = document.getElementById('docfile'); if (picker) picker.value = '';
      await loadDocs();
    } catch (e) { setMessage(e.message); }
    finally { setBusy(false); }
  }
  async function removeDoc(id) {
    if (!window.confirm('Remove this document and its indexed passages?')) return;
    setBusy(true); setMessage('');
    try { await request(`/documents/${id}`, { method: 'DELETE' }); await loadDocs(); setMessage('Document removed.'); }
    catch (e) { setMessage(e.message); }
    finally { setBusy(false); }
  }
  async function ask(e) {
    e.preventDefault(); setBusy(true); setAnswer(null); setMessage('');
    try {
      setAnswer(await request('/ask', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question, document_ids: selected.length ? selected : null }) }));
    } catch (e) { setMessage(e.message); }
    finally { setBusy(false); }
  }
  function toggle(id) { setSelected(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]); }

  return (
    <main style={T.page}><div style={T.wrap}>
      <header style={T.header}>
        <div><span style={T.eyebrow}>Document intelligence / RAG</span>
          <h1 style={T.title}>Contracts & Policies, explained.</h1>
          <p style={{ ...T.muted, margin: '4px 0 0' }}>Persistent search, grounded answers, and verifiable document citations.</p>
        </div>
        <span style={{ ...T.pill, padding: '9px 12px' }}>LangChain · Chroma · SQLite · Gemini</span>
      </header>
      {message && <div role="alert" style={{ ...T.card, background: '#f6eeda', color: '#6b541a' }}>{message}</div>}
      <div className="docqa-grid" style={T.grid}>
        <aside>
          <section style={T.card}>
            <div style={T.eyebrow}>01 / Knowledge library</div>
            <h2 style={{ fontSize: 18, margin: '7px 0 4px' }}>Add a document</h2>
            <p style={T.muted}>Upload a text-based PDF or TXT, or paste policy text.</p>
            <form onSubmit={upload}>
              <label style={T.label}>Document type</label>
              <select style={T.field} value={kind} onChange={e => setKind(e.target.value)}>
                <option value="policy">Company policy</option><option value="contract">Vendor contract</option><option value="other">Other document</option>
              </select>
              <label style={T.label}>Choose a file (PDF or TXT)</label>
              <input id="docfile" aria-label="Upload document" style={{ ...T.field, padding: 9 }} type="file" accept=".pdf,.txt"
                     onChange={e => setFile(e.target.files?.[0] || null)} />
              <label style={T.label}>Or paste document text</label>
              <input style={{ ...T.field, marginBottom: 8 }} value={title} onChange={e => setTitle(e.target.value)} placeholder="e.g. Travel Policy" disabled={!!file} />
              <textarea style={{ ...T.field, height: 100, resize: 'vertical' }} value={text} onChange={e => setText(e.target.value)}
                        placeholder="Paste the policy or contract text here" disabled={!!file} />
              <button style={{ ...T.btn, marginTop: 12, width: '100%', opacity: busy ? .6 : 1 }} disabled={busy || (!file && (!title.trim() || !text.trim()))}>
                {busy ? 'Working…' : 'Index document'}
              </button>
            </form>
          </section>
          <section style={T.card}>
            <div style={T.eyebrow}>Indexed documents</div>
            <p style={T.muted}>{docs.length} current documents. Select a subset, or leave all unchecked to search everything current.</p>
            {docs.length === 0 && <p style={T.muted}>Nothing indexed yet.</p>}
            {docs.map(d => <div key={d.id} style={{ ...T.divider, display: 'flex', gap: 8, alignItems: 'center' }}>
              <input aria-label={`Select ${d.title}`} type="checkbox" checked={selected.includes(d.id)} onChange={() => toggle(d.id)} />
              <div style={{ flex: 1, minWidth: 0 }}><div style={{ overflowWrap: 'anywhere', fontWeight: 650, fontSize: 13 }}>{d.title}</div>
                <div style={{ ...T.muted, fontSize: 11 }}>{d.kind} · v{d.version}</div></div>
              <button aria-label={`Remove ${d.title}`} style={{ ...T.outline, padding: '5px 8px' }} onClick={() => removeDoc(d.id)} disabled={busy}>×</button>
            </div>)}
          </section>
        </aside>
        <section>
          <div style={T.card}>
            <div style={T.eyebrow}>02 / Ask your documents</div>
            <h2 style={{ fontSize: 20, margin: '8px 0 5px' }}>Ask a grounded question</h2>
            <p style={T.muted}>Try “What is the travel approval threshold?” or “What is the vendor cancellation notice period?”</p>
            <form onSubmit={ask}>
              <textarea value={question} onChange={e => setQuestion(e.target.value)}
                        placeholder="Ask a question about your indexed contracts and policies…"
                        style={{ ...T.field, minHeight: 110, marginTop: 14, resize: 'vertical' }} />
              <button style={{ ...T.btn, marginTop: 12, opacity: busy ? .6 : 1 }} disabled={busy || !docs.length || !question.trim()}>
                {busy ? 'Searching…' : 'Search & answer'}
              </button>
            </form>
          </div>
          {answer && <div style={T.card}>
            <div style={{ display: 'flex', gap: 8, justifyContent: 'space-between', alignItems: 'center' }}>
              <h2 style={{ fontSize: 18, margin: '0 0 10px' }}>Answer</h2>
              {answer.needs_review && <span style={{ ...T.pill, background: '#fff3db', color: '#8d621a' }}>Review needed</span>}
            </div>
            <p style={{ whiteSpace: 'pre-wrap', lineHeight: 1.7, fontSize: 15 }}>{answer.answer}</p>
            <h3 style={{ fontSize: 13, marginTop: 24 }}>Verified source IDs</h3>
            <p style={T.muted}>Source IDs are checked against retrieved passages. Their factual support still requires review.</p>
            {(answer.sources || []).map(s => <article key={s.id} style={{ ...T.divider }}>
              <div style={{ fontSize: 13, fontWeight: 750 }}>{s.id} · {s.title} · page {s.page}</div>
              <p style={{ ...T.muted, whiteSpace: 'pre-wrap', margin: '7px 0' }}>{s.excerpt}</p>
            </article>)}
            {answer.sources?.length === 0 && <p style={T.muted}>No reliable citations returned.</p>}
          </div>}
          <div style={{ ...T.card, background: '#f0f1ed' }}>
            <div style={T.eyebrow}>Research prototype</div>
            <p style={{ ...T.muted, marginBottom: 0 }}>This local single-user demo is not legal advice. Documents are sent to Gemini for embeddings and answers. Avoid confidential material unless you have appropriate authorization.</p>
          </div>
        </section>
      </div>
    </div></main>
  );
}
