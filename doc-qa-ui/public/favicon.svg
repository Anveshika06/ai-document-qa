:root { font-family: Inter, system-ui, 'Segoe UI', sans-serif; font-synthesis: none; text-rendering: optimizeLegibility; -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
body { margin: 0; min-width: 300px; }
button, input, textarea, select { font: inherit; }
button:disabled { cursor: not-allowed !important; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid #547c70; outline-offset: 2px; }
@media (max-width: 760px) { .docqa-grid { grid-template-columns: 1fr !important; } }
